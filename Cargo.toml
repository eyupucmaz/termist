[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eyupucmaz/termist"

[workspace.dependencies]
termist-core = { path = "crates/termist-core" }
termist-platform = { path = "crates/termist-platform" }
termist-term = { path = "crates/termist-term" }
termist-daemon = { path = "crates/termist-daemon" }
termist-tui = { path = "crates/termist-tui" }
alacritty_terminal = "0.26"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
etcetera = "0.10"
insta = "1"
interprocess = { version = "2.4", features = ["tokio"] }
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
