[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eyupucmaz/termist"

[workspace.dependencies]
termist-core = { path = "crates/termist-core" }
termist-platform = { path = "crates/termist-platform" }
termist-term = { path = "crates/termist-term" }
termist-daemon = { path = "crates/termist-daemon" }
termist-tui = { path = "crates/termist-tui" }
termist-scenes = { path = "crates/termist-scenes" }
alacritty_terminal = "0.26"
anyhow = "1"
arboard = { version = "3.6", default-features = false }
clap = { version = "4", features = ["derive"] }
etcetera = "0.10"
insta = "1"
interprocess = { version = "2.4", features = ["tokio"] }
libc = "0.2"
nucleo-matcher = "0.3"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
starship-battery = "0.12"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
