[ansi]
colors = [
  "#16233a", "#ff6b6b", "#4fd18b", "#f4d35e", "#6ea8fe", "#c69fd6", "#2ec4b6", "#cad8e6",
  "#34486a", "#ff8f8f", "#79e0a8", "#f8e08a", "#98c2ff", "#d7b8e3", "#5fd9cd", "#f5faff",
]
