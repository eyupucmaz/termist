# Bebek: dark, the Bosphorus at night: deep navy, turquoise and the lights on the water.
name = "Bebek"

[ui]
bg = "#0b1424"
fg = "#e3eef7"
dim = "#92a8c0"
border = "#283c5a"
accent = "#2ec4b6"
focus = "#f4d35e"
warn = "#f4d35e"
error = "#ff6b6b"
archive = "#c69fd6"
selection = { fg = "#ffffff", bg = "#14514c" }
