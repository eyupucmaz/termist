# Nord: dark, an arctic blue north.
# Colours from Nord (github.com/nordtheme/nord), MIT licence, (c) Sven Greb.
name = "Nord"

[ui]
bg = "#2e3440"
fg = "#d8dee9"
dim = "#a3abbb"
border = "#4c566a"
accent = "#88c0d0"
focus = "#ebcb8b"
warn = "#ebcb8b"
error = "#d57780"
archive = "#b48ead"
selection = { fg = "#eceff4", bg = "#4c566a" }
tab_active = { fg = "#eceff4", bg = "#434c5e", bold = true }

[status]
fresh = "#8a93a5"
running = "#ebcb8b"
done = "#81a1c1"
ready = "#a3be8c"
waiting = "#d57780"
closed = "#8a93a5"
exited = "#b48ead"
disconnected = "#a3abbb"

[ansi]
colors = [
  "#3b4252", "#d57780", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0",
  "#4c566a", "#d57780", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4",
]
