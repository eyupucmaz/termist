# Bogazici Koprusu (seen from Ortakoy): colours for this scene's own keys, merged over palettes.toml.
#   C main cable + backstays    c hangers          B deck (road lamps at night)
#   P European tower            O Asian tower (a touch hazier, it is farther away)
#   Q / q Ortakoy Mosque marble outline / fill  (floodlit at night)
#   Y / y European hill         A / a Asian hill (Beylerbeyi)    Z / z far shore up the strait
#   e trees on the Asian hill   N cable anchorage                u ferry cabin (sprite), portholes lit at night
#   X gilded alems (crescent finials) on the minarets and the dome
#   L / l house lights on the far shore / on the Asian hill (lit from sunset, twinkle)
# At night the C / c colours are replaced by the LED colour cycle (see scene.toml).

