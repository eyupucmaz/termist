# Kiz Kulesi: the scene's own keys, merged over the shared palettes.toml.
#
#   B / b  far historic peninsula: outline on the sky / hazy fill
#   Y      far city lights on the peninsula (texture by day, lit after sunset)
#   Q      the flag on the finial
#   L      lantern glass (blinks after sunset, see scene.toml)
#   U      stone outline below the horizon, drawn on the stone fill instead of the sky
#   P / p  rock islet: edge drawn on the water / rock fill
#   J      the wooden landing stage
#   N / O  sandal (rowing boat) hull / rower and oars (sprite)
#
# P and J sit in the water, so their bg is the `water` gradient's middle (rows 20-21).

[sabah]
B = { fg = "#959ab0" }
b = { fg = "#959ab0", bg = "#c4c5d1" }
Y = { fg = "#aeb0c0", bg = "#c4c5d1" }
Q = { fg = "#d8323f" }
L = { fg = "#e6eef0", bg = "#56677a" }
U = { fg = "#8a7862", bg = "#c9b393" }
P = { fg = "#4f4943", bg = "#5282a7" }
p = { fg = "#7a7064", bg = "#a69c8e" }
J = { fg = "#5a4a3a", bg = "#5282a7" }
N = { fg = "#f4f1ea" }
O = { fg = "#3a2e24" }

