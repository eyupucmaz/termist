# Ayasofya: scene keys merged over the shared palettes.toml.
#
# Mask keys added by this scene
#   U/u main dome and semi-domes, lead outline / fill (glows at sunset)
#   P/p plaster wall, outline / fill (warm pinkish ochre)
#   X/x buttresses, pilasters and cornices: shaded plaster
#   I/i minaret shaft, outline / fill      B  şerefe (minaret balcony)
#   A   alem: gilded crescent and rod on every minaret and on the dome
#   d   gate interior                       L  mahya lights between the front minarets
#   Y/y tree canopy, outline / fill         t  tree trunk
#   g   lawn of Sultanahmet Park            e  gravel path
#   Q   fountain rim and park wall          f  fountain basin water   j  fountain jet
# W (shared) is overridden only to give windows the plaster fill behind them; R (shared) at sunset only;
# G (shared) gets the lawn behind it so the ground line never shows the water gradient.

