# Scene palettes by time of day. Keys match the characters used in each scene's mask file.
#   fg = glyph colour, bg = cell fill (omit bg to let the sky show through)
# sky / water are vertical gradients (top -> bottom); water cells animate.
#
# Mask keys
#   ' ' sky            R/r tower cone edge / fill   D dark stone trim
#   S/s stone wall / fill                          W window (lit at dusk & night)
#   H/h house wall / fill   T roof tiles   G quay   w water
#   M sun or moon      V vapur cabin   K vapur hull   F vapur chimney

[sabah] # 06-11
sky   = ["#8fbfe6", "#cfe1ee", "#f7dcc0"]
water = ["#6e9dc0", "#3f6f95"]
wave  = "#d8ecf7"
