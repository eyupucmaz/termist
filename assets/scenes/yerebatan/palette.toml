Y = { fg = "#5e6e7c" }
Z = { fg = "#2e3a45" }
U = { fg = "#3a2a1e", bg = "#9a6a44" }
u = { fg = "#3a2a1e", bg = "#a8744a" }
e = { fg = "#3a2a1e", bg = "#7c6450" }
B = { fg = "#8a6250", bg = "#3a2822" }
b = { fg = "#5a4034", bg = "#2a1f1c" }
N = { fg = "#6a5044" }
L = { fg = "#ffb760" }
O = { fg = "#d08a4c" }
