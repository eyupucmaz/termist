# Yerebatan Sarnici (Basilica Cistern): colours for this scene's own keys, merged over palettes.toml.
# The one interior scene. There is no sky: `sky` is the darkness of the brick vault, and the time
# of day becomes the lighting mood (sabah cool and dim, gunduz neutral, aksam amber, gece darkest
# with the lamps glowing strongest). The last `sky` stop equals `v`'s bg, so line-art cells below
# eye level sit on the still water seamlessly.
#
#   C / c  nearest marble columns, outline / fill     A  their capitals
#   I / i  second rank of columns                      Y  third and fourth ranks   Z  farthest
#   U / u / e  column foot lit by its lamp: outline / brightest fill / fading fill above
#   B / b  brick arches, line / band fill              N  far brick arches
#   L      lamp at a column foot (flickers)            O  far lamps (dots)
#   l      a lamp's light streak on the water          x / z  column reflections, near / far
#   v      still far water                             w  near water (waves)
#   k      the Medusa block (marble in shadow)         j  her ring of coiling snakes (algae-green)
#   q / Q  her face, spotlit from the lamp at her foot / its carved features
#   E      her eyes in dark sockets                    n  her full lips (in shadow)
#   f      carp (sprites)

[sabah] # cool, dim: the lamps are on but the vault is blue-grey
sky   = ["#05070a", "#0b1117", "#141d26"]
water = ["#121b24", "#070b10"]
wave  = "#3e5566"
v = { fg = "#2a3a48", bg = "#141d26" }
C = { fg = "#29333c", bg = "#6b757d" }
c = { fg = "#29333c", bg = "#626c75" }
A = { fg = "#1f272e", bg = "#7d878e" }
