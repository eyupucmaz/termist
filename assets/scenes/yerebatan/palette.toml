x = { fg = "#4a5a68" }
z = { fg = "#2c3843" }
k = { fg = "#24221f", bg = "#4a4640" }
Q = { fg = "#1e1a16", bg = "#9a8c78" }
q = { fg = "#24201c", bg = "#9a8c78" }
E = { fg = "#e8dcc4", bg = "#3e362c" }
n = { fg = "#d8ccb4", bg = "#4a3e32" }
